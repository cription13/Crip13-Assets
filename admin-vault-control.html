<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault Control Center | Velvet Grid Admin</title>
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --paper: #f7f8fb;
      --white: #ffffff;
      --ink: #0d1b2f;
      --navy: #173c75;
      --blue: #2f6fd6;
      --blue-soft: #eaf2ff;
      --grid: rgba(31, 79, 143, 0.09);
      --line: rgba(23, 60, 117, 0.14);
      --muted: #68758a;
      --gold: #c99a37;
      --gold-soft: #fff6df;
      --success: #2d8f3f;
      --success-soft: #e8f5eb;
      --danger: #9f3636;
      --danger-soft: #fce8e8;
      --shadow: 0 26px 80px rgba(18, 45, 88, 0.14);
      --soft-shadow: 0 16px 40px rgba(18, 45, 88, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 14% 18%, rgba(47, 111, 214, 0.08), transparent 27%),
        radial-gradient(circle at 88% 8%, rgba(201, 154, 55, 0.08), transparent 24%),
        var(--paper);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
    }

    button, input {
      font: inherit;
    }

    .admin-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 42px 18px;
      position: relative;
      overflow: hidden;
    }

    .admin-container {
      width: min(1100px, 100%);
      display: grid;
      gap: 28px;
    }

    .admin-header {
      text-align: center;
      padding: 42px 28px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .admin-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--navy);
      font-weight: 800;
    }

    .admin-logo img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .admin-title {
      margin: 0;
      color: var(--ink);
      font-size: 2.1rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .admin-subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .admin-section {
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(22px);
    }

    .admin-section h2 {
      margin: 0 0 18px;
      color: var(--navy);
      font-size: 1.1rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-label {
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    .form-input {
      min-height: 44px;
      padding: 12px 14px;
      border: 1px solid rgba(23, 60, 117, 0.18);
      border-radius: 12px;
      background: var(--white);
      color: var(--ink);
      font-size: 0.94rem;
      transition: border-color 220ms ease, box-shadow 220ms ease;
    }

    .form-input:focus {
      outline: none;
      border-color: rgba(47, 111, 214, 0.4);
      box-shadow: 0 0 0 3px rgba(47, 111, 214, 0.06);
    }

    .btn {
      position: relative;
      min-height: 44px;
      padding: 0 24px;
      border: 1px solid rgba(23, 60, 117, 0.2);
      border-radius: 12px;
      color: var(--white);
      background: linear-gradient(135deg, #0d1b2f, #173c75);
      box-shadow: 0 18px 42px rgba(23, 60, 117, 0.18);
      font-size: 0.92rem;
      font-weight: 850;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease, opacity 220ms ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 0 28%, rgba(255, 255, 255, 0.2) 44%, transparent 62% 100%);
      transform: translateX(-120%);
      transition: transform 700ms ease;
    }

    .btn:hover:not(:disabled),
    .btn:focus-visible {
      outline: none;
      transform: translateY(-2px);
      box-shadow: 0 22px 54px rgba(23, 60, 117, 0.25);
    }

    .btn:hover:not(:disabled)::before,
    .btn:focus-visible::before {
      transform: translateX(120%);
    }

    .btn:disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }

    .btn-success {
      background: linear-gradient(135deg, #2d8f3f, #1e5c2a);
      box-shadow: 0 18px 42px rgba(45, 143, 63, 0.18);
    }

    .btn-success:hover:not(:disabled) {
      box-shadow: 0 22px 54px rgba(45, 143, 63, 0.25);
    }

    .status-message {
      min-height: 24px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.45;
      display: none;
    }

    .status-message.show {
      display: block;
    }

    .status-message.error {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(159, 54, 54, 0.2);
    }

    .status-message.success {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(45, 143, 63, 0.2);
    }

    .token-output {
      display: none;
      padding: 18px;
      border: 2px solid rgba(45, 143, 63, 0.3);
      border-radius: 14px;
      background: var(--success-soft);
    }

    .token-output.show {
      display: grid;
      gap: 14px;
    }

    .token-item {
      display: grid;
      gap: 6px;
    }

    .token-label {
      color: var(--navy);
      font-size: 0.74rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    .token-value {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--white);
      border: 1px solid rgba(23, 60, 117, 0.12);
      border-radius: 10px;
      font-family: "Monaco", "Menlo", monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
      word-break: break-all;
    }

    .copy-btn {
      flex-shrink: 0;
      min-width: 40px;
      height: 40px;
      padding: 0;
      margin-left: 8px;
      border: 1px solid rgba(23, 60, 117, 0.18);
      border-radius: 8px;
      background: var(--white);
      color: var(--blue);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color 220ms ease, color 220ms ease;
    }

    .copy-btn:hover {
      background: var(--blue-soft);
      border-color: rgba(47, 111, 214, 0.3);
    }

    .copy-btn.copied {
      background: var(--success-soft);
      color: var(--success);
    }

    .vault-link-btn {
      display: inline-block;
      padding: 12px 20px;
      background: var(--blue);
      color: var(--white);
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: background 220ms ease;
    }

    .vault-link-btn:hover {
      background: #2456b8;
    }

    .token-history {
      display: none;
    }

    .token-history.show {
      display: grid;
      gap: 12px;
    }

    .history-list {
      max-height: 400px;
      overflow-y: auto;
      display: grid;
      gap: 8px;
    }

    .history-item {
      padding: 12px 14px;
      border: 1px solid rgba(23, 60, 117, 0.12);
      border-radius: 10px;
      background: var(--white);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }

    .history-token {
      font-family: "Monaco", "Menlo", monospace;
      font-weight: 700;
      color: var(--navy);
    }

    .history-meta {
      display: grid;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .history-status {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-unused {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .status-used {
      background: var(--gold-soft);
      color: var(--gold);
    }

    @media (max-width: 900px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }

      .admin-page {
        padding: 24px 12px;
      }

      .admin-title {
        font-size: 1.8rem;
      }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="admin-page">
    <div class="admin-container">
      <section class="admin-header">
        <div class="admin-logo">
          <img src="assets/logo.jpg" alt="Velvet Grid">
          <span>Velvet Grid</span>
        </div>
        <h1 class="admin-title">Vault Token Generator</h1>
        <p class="admin-subtitle">Admin Control Center — Generate and manage exclusive vault access tokens</p>
      </section>

      <div class="admin-grid">
        <!-- Authentication & Token Generation -->
        <section class="admin-section">
          <h2>Generate New Token</h2>
          
          <div class="auth-form">
            <div class="form-group">
              <label class="form-label">Admin Key</label>
              <input 
                type="password" 
                class="form-input" 
                id="adminKeyInput" 
                placeholder="Enter admin key"
              >
            </div>

            <button class="btn btn-success" id="generateBtn">
              Generate New Vault Token
            </button>

            <div class="status-message" id="statusMessage"></div>

            <div class="token-output" id="tokenOutput">
              <div class="token-item">
                <span class="token-label">Unique Token</span>
                <div class="token-value">
                  <span id="tokenValue">VG82K1</span>
                  <button class="copy-btn" data-copy="tokenValue" title="Copy token">📋</button>
                </div>
              </div>

              <div class="token-item">
                <span class="token-label">Access Code</span>
                <div class="token-value">
                  <span id="codeValue">VG-4821</span>
                  <button class="copy-btn" data-copy="codeValue" title="Copy code">📋</button>
                </div>
              </div>

              <div class="token-item">
                <span class="token-label">Vault Link</span>
                <div class="token-value">
                  <span id="urlValue">/vault?token=VG82K1</span>
                  <button class="copy-btn" data-copy="urlValue" title="Copy link">📋</button>
                </div>
              </div>

              <div>
                <a href="" id="vaultLink" class="vault-link-btn" target="_blank">
                  Open Vault Link
                </a>
              </div>
            </div>
          </div>
        </section>

        <!-- Token History -->
        <section class="admin-section">
          <h2>Recent Tokens</h2>

          <div class="token-history" id="tokenHistory">
            <div class="history-list" id="historyList">
              <div style="padding: 18px; text-align: center; color: var(--muted);">
                No tokens generated yet
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const adminKeyInput = document.getElementById("adminKeyInput");
    const generateBtn = document.getElementById("generateBtn");
    const statusMessage = document.getElementById("statusMessage");
    const tokenOutput = document.getElementById("tokenOutput");
    const tokenHistory = document.getElementById("tokenHistory");
    const historyList = document.getElementById("historyList");

    const tokenValue = document.getElementById("tokenValue");
    const codeValue = document.getElementById("codeValue");
    const urlValue = document.getElementById("urlValue");
    const vaultLink = document.getElementById("vaultLink");

    let generatedTokens = [];

    // Base API URL (deployed Render backend)
    // CRITICAL: Must match the actual backend URL
    const BASE_API_URL = "https://prime-web-project.onrender.com";

    function buildApiUrl(endpoint) {
      if (!endpoint) return BASE_API_URL;
      // If already a full URL, return as-is
      if (endpoint.startsWith("http://") || endpoint.startsWith("https://")) return endpoint;
      // If path starts with /, append directly to base URL
      if (endpoint.startsWith("/")) return BASE_API_URL + endpoint;
      // Otherwise treat as relative path
      return BASE_API_URL + "/" + endpoint;
    }

    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle("error", isError);
      statusMessage.classList.toggle("success", !isError);
      statusMessage.classList.add("show");
      
      if (!isError) {
        setTimeout(() => {
          statusMessage.classList.remove("show");
        }, 4000);
      }
    }

    function copyToClipboard(elementId) {
      const element = document.getElementById(elementId);
      const text = element.textContent;
      
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        btn.textContent = "✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "📋";
          btn.classList.remove("copied");
        }, 2000);
      }).catch(() => {
        showStatus("Failed to copy to clipboard", true);
      });
    }

    function displayToken(token, code, url) {
      tokenValue.textContent = token;
      codeValue.textContent = code;
      urlValue.textContent = url;
      vaultLink.href = url;
      tokenOutput.classList.add("show");
    }

    function updateHistory() {
      if (generatedTokens.length === 0) {
        historyList.innerHTML = `
          <div style="padding: 18px; text-align: center; color: var(--muted);">
            No tokens generated yet
          </div>
        `;
        return;
      }

      historyList.innerHTML = generatedTokens
        .map((t) => `
          <div class="history-item">
            <span class="history-token">${t.token}</span>
            <div class="history-meta">
              <div>${t.clientName || "Admin Generated"}</div>
              <div>${new Date(t.createdAt).toLocaleString()}</div>
            </div>
            <span class="history-status ${t.used ? 'status-used' : 'status-unused'}">
              ${t.used ? 'Used' : 'Unused'}
            </span>
          </div>
        `)
        .join("");
    }

    async function generateToken() {
      const adminKey = adminKeyInput.value.trim();

      if (!adminKey) {
        showStatus("Please enter admin key", true);
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 second timeout

        const response = await fetch(buildApiUrl('/api/vault/generate'), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Key": adminKey
          },
          body: JSON.stringify({}),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        // Parse JSON with error guard
        let data;
        try {
          data = await response.json();
        } catch (parseError) {
          console.error("JSON Parse Error:", parseError, "Response status:", response.status);
          showStatus("Server error: invalid response. Check backend logs.", true);
          generateBtn.disabled = false;
          generateBtn.textContent = "Generate New Vault Token";
          return;
        }

        if (!response.ok || !data.success) {
          const message = data.message || `Server error (HTTP ${response.status})`;
          showStatus(message, true);
          console.warn("Generation failed:", { status: response.status, data });
          generateBtn.disabled = false;
          generateBtn.textContent = "Generate New Vault Token";
          return;
        }

        // Validate response contains required fields
        if (!data.token || !data.code || !data.vaultUrl) {
          showStatus("Server returned incomplete token data", true);
          console.error("Incomplete token response:", data);
          generateBtn.disabled = false;
          generateBtn.textContent = "Generate New Vault Token";
          return;
        }

        displayToken(data.token, data.code, data.vaultUrl);
        showStatus("✓ Token generated successfully", false);
        console.log("Token generated:", data.token);

        // Add to history
        generatedTokens.unshift({
          token: data.token,
          code: data.code,
          clientName: "Admin Generated",
          createdAt: new Date().toISOString(),
          used: false
        });

        if (generatedTokens.length > 20) {
          generatedTokens.pop();
        }

        tokenHistory.classList.add("show");
        updateHistory();

      } catch (error) {
        if (error.name === 'AbortError') {
          showStatus("Request timed out after 10 seconds. Server may be unresponsive.", true);
          console.error("Request timeout");
        } else {
          showStatus("Network error: " + error.message, true);
          console.error("Fetch error:", error);
        }
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate New Vault Token";
      }
    }

    // Event listeners
    generateBtn.addEventListener("click", generateToken);

    adminKeyInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        generateToken();
      }
    });

    document.querySelectorAll(".copy-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        copyToClipboard(btn.dataset.copy);
      });
    });

    // Load history on startup
    updateHistory();
  </script>
</body>
</html>
