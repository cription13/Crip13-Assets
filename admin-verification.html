<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velvet Grid Admin | Reward Verification</title>
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">n
  <style>
    :root {
      --paper: #f7f8fb;
      --white: #ffffff;
      --ink: #0d1b2f;
      --navy: #173c75;
      --blue: #2f6fd6;
      --blue-soft: #eaf2ff;
      --grid: rgba(31, 79, 143, 0.09);
      --line: rgba(23, 60, 117, 0.14);
      --muted: #68758a;
      --gold: #c99a37;
      --shadow: 0 26px 80px rgba(18, 45, 88, 0.14);
      --soft-shadow: 0 16px 40px rgba(18, 45, 88, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 14% 18%, rgba(47, 111, 214, 0.08), transparent 27%),
        radial-gradient(circle at 88% 8%, rgba(201, 154, 55, 0.08), transparent 24%),
        var(--paper);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
    }

    button,
    input {
      font: inherit;
    }

    .admin-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 42px 18px;
    }

    .admin-shell {
      width: min(980px, 100%);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .admin-panel {
      display: grid;
      grid-template-columns: minmax(0, 0.78fr) minmax(360px, 1fr);
      gap: 34px;
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(247, 250, 255, 0.76)),
        linear-gradient(90deg, rgba(23, 60, 117, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(23, 60, 117, 0.05) 1px, transparent 1px);
      background-size: auto, 34px 34px, 34px 34px;
    }

    .brand-row {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 42px;
      color: var(--navy);
      font-weight: 800;
    }

    .brand-mark {
      display: grid;
      grid-template-columns: repeat(3, 8px);
      grid-template-rows: repeat(3, 8px);
      gap: 3px;
      width: 34px;
      height: 34px;
      padding: 3px;
      border: 1px solid rgba(23, 60, 117, 0.18);
      border-radius: 8px;
      background: var(--white);
      box-shadow: var(--soft-shadow);
    }

    .brand-mark span {
      display: block;
      border-radius: 3px;
      background: var(--blue);
    }

    .brand-mark span:nth-child(2),
    .brand-mark span:nth-child(6) {
      background: #5bc0c7;
    }

    .brand-mark span:nth-child(5) {
      background: var(--gold);
    }

    .admin-label {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      line-height: 0.98;
      font-weight: 900;
      text-transform: uppercase;
    }

    .admin-copy {
      max-width: 420px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 34px;
    }

    .stat-card {
      min-height: 92px;
      padding: 16px;
      border: 1px solid rgba(23, 60, 117, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--soft-shadow);
    }

    .stat-card span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stat-card strong {
      display: block;
      margin-top: 10px;
      color: var(--navy);
      font-size: 1.7rem;
      line-height: 1;
    }

    .verify-card {
      padding: 24px;
      border: 1px solid rgba(23, 60, 117, 0.12);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: var(--soft-shadow);
    }

    .verify-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .verify-input {
      width: 100%;
      min-height: 52px;
      padding: 0 18px;
      border: 1px solid rgba(23, 60, 117, 0.16);
      border-radius: 999px;
      color: var(--ink);
      background: var(--white);
      font-weight: 800;
      text-transform: uppercase;
    }

    .verify-input:focus {
      outline: none;
      border-color: rgba(47, 111, 214, 0.5);
      box-shadow: 0 0 0 4px rgba(47, 111, 214, 0.08);
    }

    .verify-button,
    .claim-button {
      min-height: 52px;
      padding: 0 20px;
      border: 1px solid rgba(23, 60, 117, 0.16);
      border-radius: 999px;
      color: var(--white);
      background: linear-gradient(135deg, var(--ink), var(--navy));
      font-weight: 850;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .verify-button:hover,
    .verify-button:focus-visible,
    .claim-button:hover,
    .claim-button:focus-visible {
      outline: none;
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(23, 60, 117, 0.2);
    }

    .verify-result {
      min-height: 112px;
      margin-top: 14px;
      padding: 18px;
      border: 1px solid rgba(23, 60, 117, 0.1);
      border-radius: 16px;
      background: rgba(247, 248, 251, 0.9);
      color: var(--muted);
      line-height: 1.55;
    }

    .verify-result strong {
      color: var(--ink);
    }

    .verify-result.is-valid {
      border-color: rgba(47, 111, 214, 0.22);
      background: var(--blue-soft);
    }

    .verify-result.is-invalid {
      border-color: rgba(160, 48, 48, 0.2);
      background: #fff5f5;
    }

    .claim-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
    }

    .claim-button[hidden] {
      display: none;
    }

    @media (max-width: 860px) {
      .admin-panel {
        grid-template-columns: 1fr;
        padding: 28px;
      }
    }

    @media (max-width: 620px) {
      .admin-page {
        padding: 18px 12px;
      }

      .admin-shell {
        padding: 12px;
        border-radius: 20px;
      }

      .admin-panel {
        padding: 22px 16px;
        border-radius: 16px;
      }

      .stats-grid,
      .verify-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="admin-page">
    <section class="admin-shell" aria-labelledby="admin-title">
      <div class="admin-panel">
        <div>
          <div class="brand-row" aria-label="Velvet Grid">
            <img class="brand-mark" src="assets/logo.jpg" alt="" aria-hidden="true" />
            <span>Velvet Grid</span>
          </div>

          <p class="admin-label">STAFF VERIFICATION</p>
          <h1 id="admin-title">Reward Admin</h1>
          <p class="admin-copy">Verify one-time Velvet Vault codes. Golden Ticket claims are rejected because the 50% card is never generated.</p>

          <div class="stats-grid" aria-label="Reward registry summary">
            <div class="stat-card">
              <span>Total Codes</span>
              <strong data-total-count>0</strong>
            </div>
            <div class="stat-card">
              <span>Unclaimed</span>
              <strong data-unclaimed-count>0</strong>
            </div>
            <div class="stat-card">
              <span>Rare 20%</span>
              <strong data-rare-count>0</strong>
            </div>
          </div>
        </div>

        <div class="verify-card">
          <form class="verify-form" data-verify-form>
            <input class="verify-input" type="text" inputmode="latin" autocomplete="off" placeholder="VG-10P-4832" aria-label="Reward verification code" data-verify-input />
            <button class="verify-button" type="submit">Verify</button>
          </form>

          <div class="verify-result" aria-live="polite" data-verify-result>
            Awaiting a Velvet Vault code.
          </div>

          <button class="claim-button" type="button" data-claim-button hidden>Mark As Claimed</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "velvetGridVaultRewards";
    const verifyForm = document.querySelector("[data-verify-form]");
    const verifyInput = document.querySelector("[data-verify-input]");
    const verifyResult = document.querySelector("[data-verify-result]");
    const claimButton = document.querySelector("[data-claim-button]");
    const totalCount = document.querySelector("[data-total-count]");
    const unclaimedCount = document.querySelector("[data-unclaimed-count]");
    const rareCount = document.querySelector("[data-rare-count]");
    let activeVerifiedCode = "";

    function loadRewardRegistry() {
      try {
        const stored = window.localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (error) {
        return [];
      }
    }

    function saveRewardRegistry(records) {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function normalizeCode(value) {
      return value.trim().toUpperCase();
    }

    function formatDate(value) {
      if (!value) {
        return "Not recorded";
      }

      return new Date(value).toLocaleString([], {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function refreshSummary() {
      const records = loadRewardRegistry();
      totalCount.textContent = records.length;
      unclaimedCount.textContent = records.filter((record) => record.status !== "claimed").length;
      rareCount.textContent = records.filter((record) => record.percentage === "20%").length;
    }

    function renderVerification(record) {
      verifyResult.className = "verify-result is-valid";
      verifyResult.innerHTML = `
        <strong>Valid one-time Velvet Vault code</strong><br>
        Reward type: <strong>${record.rewardType}</strong><br>
        Percentage: <strong>${record.percentage}</strong><br>
        Claim status: <strong>${record.status}</strong><br>
        Final attempt: <strong>${record.final ? "closed" : "unknown"}</strong><br>
        Created: ${formatDate(record.createdAt)}<br>
        Claimed: ${formatDate(record.claimedAt)}
      `;

      activeVerifiedCode = record.code;
      claimButton.hidden = record.status === "claimed";
      refreshSummary();
    }

    function rejectVerification(message) {
      verifyResult.className = "verify-result is-invalid";
      verifyResult.textContent = message;
      activeVerifiedCode = "";
      claimButton.hidden = true;
    }

    function verifyCode(code) {
      const normalizedCode = normalizeCode(code);

      if (!normalizedCode) {
        rejectVerification("Enter a Velvet Vault verification code.");
        return;
      }

      if (/^VG-50P-\d{4}$/.test(normalizedCode)) {
        rejectVerification("Invalid code. The Legendary Golden Ticket is unreachable and cannot be claimed.");
        return;
      }

      if (!/^VG-(5|10|20)P-\d{4}$/.test(normalizedCode)) {
        rejectVerification("Invalid format. Real codes look like VG-10P-4832 and only support 5%, 10%, or 20% rewards.");
        return;
      }

      const records = loadRewardRegistry();
      const record = records.find((item) => item.code === normalizedCode);

      if (!record) {
        rejectVerification("Code not found in the Velvet Vault registry. This reward cannot be verified.");
        return;
      }

      renderVerification(record);
    }

    verifyForm.addEventListener("submit", (event) => {
      event.preventDefault();
      verifyCode(verifyInput.value);
    });

    claimButton.addEventListener("click", () => {
      if (!activeVerifiedCode) {
        return;
      }

      const records = loadRewardRegistry();
      const recordIndex = records.findIndex((record) => record.code === activeVerifiedCode);

      if (recordIndex === -1) {
        rejectVerification("Code not found in the Velvet Vault registry. This reward cannot be verified.");
        return;
      }

      records[recordIndex].status = "claimed";
      records[recordIndex].claimedAt = new Date().toISOString();
      saveRewardRegistry(records);
      renderVerification(records[recordIndex]);
    });

    refreshSummary();
  </script>
</body>
</html>
